[project]
name = "kept"
version = "0.1.0"
description = "Bee remembers what you said. Kept makes sure you do it."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "John Wilson" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[project.scripts]
kept = "kept.cli:main"

[project.urls]
Homepage = "https://github.com/johnwils/kept"
Issues = "https://github.com/johnwils/kept/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
[tool.hatch.build.targets.wheel]
packages = ["src/kept"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
